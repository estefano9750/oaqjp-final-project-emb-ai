<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NLP - Emotion Detection</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
    <script src="{{ url_for('static', filename='mywebscript.js') }}" defer></script>
    <style>
        .center-heading { text-align: center; }
        .page-content { padding: 25px; }
        #system_response { white-space: pre-wrap; }
    </style>
</head>
<body>
    <main class="container mt-4">
        <div class="card">
            <div class="card-body page-content">
                <h1 class="center-heading mb-4">NLP - Emotion Detection</h1>
                <label for="textToAnalyze" class="form-label">
                    Please enter the text to be analyzed
                </label>
                <textarea class="form-control" id="textToAnalyze" rows="4"
                    placeholder="Write a sentence here..."></textarea>

                <div class="mt-3 mb-4">
                    <button id="analyzeButton" class="btn btn-primary"
                        onclick="RunSentimentAnalysis()">Analyze emotions</button>
                </div>

                <h2 class="h4">Result of Emotion Detection</h2>
                <div id="system_response" class="alert alert-light" role="status"
                    aria-live="polite">Your result will appear here.</div>
            </div>
        </div>
    </main>
</body>
</html>
